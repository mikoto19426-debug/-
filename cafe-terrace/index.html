<title>夜のカフェテラス</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* Layout: a tall scroll track drives one fixed WebGL view of the real painting; captions float above it. Single night look. */
:root {
  --night: #0c1636;
  --ink: #070d24;
  --gas: #f3c95c;
  --cream: #fbf0cf;
  --ochre: #d99a3a;
  --muted: rgba(251, 240, 207, 0.55);
  --veil: rgba(7, 13, 36, 0.55);
  --font-jp: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-fr: "Cormorant Garamond", "Times New Roman", serif;
  color-scheme: dark;
}
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
body {
  background: var(--night);
  color: var(--cream);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
#track { height: 1100vh; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fallback { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#cap {
  position: fixed; left: 50%;
  top: calc(9% + env(safe-area-inset-top, 0px));
  transform: translate(-50%, 8px);
  max-width: min(86vw, 34em);
  padding: 0.6em 1.6em;
  font-family: var(--font-jp); font-weight: 600;
  font-size: clamp(16px, 2.3vw, 28px); line-height: 1.6;
  text-align: center; color: var(--cream);
  text-shadow: 0 0 14px var(--ink), 0 0 4px var(--ink);
  background: radial-gradient(ellipse at center, var(--veil) 0%, transparent 72%);
  opacity: 0;
  transition: opacity 0.8s ease, transform 0.9s cubic-bezier(.2,.9,.3,1.2);
  pointer-events: none; text-wrap: balance;
}
#cap.on { opacity: 1; transform: translate(-50%, 0); }
#cap.low { top: auto; bottom: calc(12% + env(safe-area-inset-bottom, 0px)); }
#hint {
  position: fixed; left: 50%;
  bottom: calc(5% + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: var(--muted); font-family: var(--font-jp); font-size: 13px;
  transition: opacity 0.6s ease; pointer-events: none;
}
#hint .mouse { width: 22px; height: 34px; border: 2px solid var(--muted); border-radius: 12px; position: relative; }
#hint .mouse::after { content: ""; position: absolute; left: 50%; top: 6px; width: 3px; height: 7px; margin-left: -1.5px; border-radius: 2px; background: var(--gas); animation: wheel 1.8s ease-in-out infinite; }
@keyframes wheel { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(10px); opacity: 0; } 100% { opacity: 0; } }
#bonjour {
  position: fixed; left: 50%; top: 78%;
  transform: translate(-50%, -40%) scale(0.96);
  font-family: var(--font-fr); font-weight: 600;
  font-size: clamp(60px, 11vw, 180px); letter-spacing: 0.04em;
  color: var(--cream);
  text-shadow: 0 0 30px rgba(255, 214, 120, 0.9), 0 0 80px rgba(255, 180, 60, 0.6), 0 2px 0 var(--ochre);
  opacity: 0;
  transition: opacity 1.4s ease, transform 1.8s cubic-bezier(.2,.9,.3,1.1);
  pointer-events: none; white-space: nowrap;
}
#bonjour.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#rail {
  position: fixed;
  right: calc(18px + env(safe-area-inset-right, 0px));
  top: 50%; transform: translateY(-50%);
  width: 3px; height: 120px; border-radius: 2px;
  background: rgba(251, 240, 207, 0.2); pointer-events: none;
}
#rail i { position: absolute; left: 0; top: 0; width: 100%; height: 0; border-radius: 2px; background: var(--gas); }
#credit {
  position: fixed;
  left: calc(14px + env(safe-area-inset-left, 0px));
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  font-family: var(--font-jp); font-size: 11px; line-height: 1.5;
  color: var(--muted); text-shadow: 0 0 6px var(--ink);
  pointer-events: none; max-width: 60vw;
}
#top {
  position: fixed; left: 50%;
  bottom: calc(6% + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  font-family: var(--font-jp); font-weight: 600; font-size: 15px;
  color: var(--cream);
  background: rgba(10, 18, 48, 0.6);
  border: 1.5px solid rgba(243, 201, 92, 0.55);
  border-radius: 999px; padding: 0.5em 1.4em; cursor: pointer;
  opacity: 0; transition: opacity 0.6s ease;
}
#top.on { opacity: 1; }
#top:focus-visible { outline: 3px solid var(--gas); outline-offset: 3px; }
#loading {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-jp); font-size: 16px; color: var(--muted);
  background: var(--night); transition: opacity 0.8s ease;
}
#loading.gone { opacity: 0; pointer-events: none; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { #hint .mouse::after { animation: none; } }
</style>

<div id="track"></div>
<canvas id="stage" role="img" aria-label="ゴッホの「夜のカフェテラス」の中へスクロールで入っていき、最後に麦わら帽子のゴッホに出会う。"></canvas>
<img id="fallback" alt="フィンセント・ファン・ゴッホ「夜のカフェテラス」" hidden>
<div id="cap" aria-live="polite"></div>
<div id="hint"><div class="mouse"></div><span>スクロール</span></div>
<div id="bonjour" aria-hidden="true">Bonjour</div>
<div id="rail" aria-hidden="true"><i></i></div>
<div id="credit">フィンセント・ファン・ゴッホ「夜のカフェテラス」1888年／「麦わら帽子の自画像」1887年（パブリックドメイン）</div>
<button id="top" type="button" hidden>最初から</button>
<div id="loading">絵を運んでいます…</div>

<script>
(() => {
'use strict';
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

/* painting geometry, measured on the images (u, v in 0..1 of each image) */
const ASP_A = 2348 / 2945, ASP_B = 2087 / 2700;
const STARS = [
  [.722, .024, .0146], [.507, .072, .0097], [.633, .190, .0136], [.693, .113, .0097],
  [.543, .240, .0088], [.599, .014, .0068], [.389, .039, .0058], [.569, .130, .0058],
  [.593, .268, .0063], [.598, .319, .0058], [.685, .225, .0058], [.806, .088, .0073],
  [.442, .037, .0058], [.717, .166, .0050], [.653, .072, .0048], [.757, .161, .0046]
];
const LAMP = [.37, .478];

/* camera keyframes: [scroll, centerX (painting-height units), centerY, view height] */
const A = ASP_A;
const KA = [
  [0.00, A / 2, 0.50, 2.4],   // museum wall
  [0.15, 0.40, 0.25, 0.50],   // inside: the sky
  [0.30, 0.47, 0.17, 0.34],   // close on the stars
  [0.44, 0.30, 0.45, 0.36],   // awning and lantern
  [0.58, 0.32, 0.62, 0.32],   // the terrace crowd
  [0.72, 0.345, 0.72, 0.20],  // an empty table
  [0.84, 0.345, 0.733, 0.10], // into the empty seat
  [1.00, 0.345, 0.733, 0.10]
];
const KB = [
  [0.00, 0.33, 0.44, 0.28], [0.72, 0.33, 0.44, 0.28], [0.90, 0.36, 0.47, 0.46], [1.00, 0.37, 0.47, 0.48]
];
const CAPS = [
  [0.00, 0.07, '下へスクロールして、絵の中へ', true],
  [0.19, 0.34, '1888年、アルル', false],
  [0.39, 0.50, 'カフェの明かりが、石畳を照らしている', false],
  [0.54, 0.66, 'にぎやかな声が聞こえる', true],
  [0.74, 0.80, '空いている席がひとつ', true],
  [0.85, 0.94, '……やあ、きみも絵の中に来たのかい？', true]
];

function sample(keys, p) {
  if (p <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (p <= b[0]) { const t = ease((p - a[0]) / (b[0] - a[0])); return [lerp(a[1], b[1], t), lerp(a[2], b[2], t), lerp(a[3], b[3], t)]; }
  }
  return keys[keys.length - 1].slice(1);
}
function fitInside(cam, asp, screenAsp, w) {
  if (w <= 0) return cam;
  const h = Math.min(cam[2], asp / screenAsp, 1);
  const hw = h * screenAsp / 2, hh = h / 2;
  const x = clamp(cam[0], hw, asp - hw), y = clamp(cam[1], hh, 1 - hh);
  return [lerp(cam[0], x, w), lerp(cam[1], y, w), lerp(cam[2], h, w)];
}

/* ---------- DOM ---------- */
const cv = document.getElementById('stage');
const capEl = document.getElementById('cap'), hintEl = document.getElementById('hint');
const bonEl = document.getElementById('bonjour'), railEl = document.querySelector('#rail i');
const topEl = document.getElementById('top'), loadEl = document.getElementById('loading');
topEl.addEventListener('click', () => window.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }));

function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }

/* ---------- WebGL ---------- */
const VS = `attribute vec2 p; varying vec2 vUv; void main(){ vUv = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;
const FS = `precision highp float;
varying vec2 vUv;
uniform sampler2D uA; uniform sampler2D uB;
uniform vec2 uRes; uniform vec3 uCamA; uniform vec3 uCamB;
uniform float uAspA; uniform float uAspB; uniform float uT; uniform float uMix; uniform float uGold; uniform float uLive;
uniform vec3 uStars[16]; uniform vec2 uLamp;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.03; a*=.5; } return v; }
vec2 toWorld(vec3 cam){ vec2 s=(vUv-.5)*vec2(uRes.x/uRes.y,1.); return cam.xy + s*cam.z; }
void main(){
  float asp = uRes.x/uRes.y;
  vec2 wa = toWorld(uCamA); vec2 ua = wa/vec2(uAspA,1.);
  vec3 col;
  if (ua.x>=0. && ua.x<=1. && ua.y>=0. && ua.y<=1.) {
    float sky = smoothstep(.40,.30,ua.y)*smoothstep(.28,.40,ua.x);
    vec2 dn = vec2(fbm(ua*14.+vec2(uT*.12,0.)), fbm(ua*14.+vec2(5.2,uT*.1))) - .5;
    col = texture2D(uA, ua + dn*(.006*sky + .0012)*uLive).rgb;
    for (int i=0;i<16;i++) {
      vec3 s = uStars[i];
      vec2 dv = (ua-s.xy)*vec2(uAspA,1.); float d = length(dv);
      float tw = .7 + .3*sin(uT*2.1 + float(i)*1.9);
      col += vec3(1.,.92,.55)*exp(-d*d/(s.z*s.z*1.2))*.45*tw*uLive;
      float ang = atan(dv.y, dv.x);
      float ring = exp(-pow((d - s.z*1.9)/(s.z*.5), 2.))*(.55 + .45*sin(ang*5. - uT*1.4 + float(i)));
      col += vec3(.95,.92,.6)*ring*.28*tw*uLive;
    }
    vec2 lv = (ua-uLamp)*vec2(uAspA,1.);
    float fl = .92 + .05*sin(uT*7.3) + .03*sin(uT*12.7);
    col += vec3(1.,.72,.32)*exp(-dot(lv,lv)/(.0016*fl))*.35*uLive;
    col += vec3(1.,.65,.3)*exp(-dot(lv,lv)/(.03*fl))*.10*uLive;
  } else {
    vec2 q = max(max(-wa, wa-vec2(uAspA,1.)), 0.); float e = max(q.x,q.y); float fw = .07;
    if (e < fw) {
      float t = e/fw;
      float n = noise(wa*vec2(300.,30.))*.25 + noise(wa*vec2(30.,300.))*.25;
      col = mix(vec3(.45,.30,.10), vec3(.95,.76,.36), (.55+.45*sin(t*3.14159))*.8 + n*.4);
      if (t < .12) col *= .55;
      if (t > .9) col *= .7;
    } else {
      float n = fbm(wa*18.)*.5 + fbm(wa*90.)*.25;
      col = vec3(.085,.115,.105)*(.75+n);
      vec2 o = wa - vec2(.035,.06);
      vec2 sq = max(max(-o, o-vec2(uAspA,1.)), 0.);
      col *= mix(.45, 1., smoothstep(fw, fw+.14, max(sq.x,sq.y)));
      float spot = exp(-pow(length((wa-vec2(uAspA*.5,.35))*vec2(.55,.45)),2.)*1.2);
      col += vec3(1.,.9,.7)*spot*.10*(.95+.05*sin(uT*1.7));
      if (wa.y > 1.55) col = vec3(.16,.12,.09)*(.8+.4*noise(wa*vec2(8.,80.)));
    }
  }
  if (uMix > 0.) {
    vec2 ub = toWorld(uCamB)/vec2(uAspB,1.);
    vec2 dnb = vec2(noise(ub*20.+uT*.2), noise(ub*20.+3.+uT*.2)) - .5;
    vec3 cb = texture2D(uB, clamp(ub + dnb*.0015*uLive, 0., 1.)).rgb;
    float n = fbm(vec2(vUv.x*3.+vUv.y*1.5, vUv.y*16.-vUv.x*2.)*1.3);
    col = mix(col, cb, smoothstep(n-.04, n+.04, uMix*1.25-.1));
  }
  if (uGold > 0.) {
    float r = length((vUv-.5)*vec2(asp,1.));
    col = mix(col, col*vec3(1.08,1.,.86) + vec3(.25,.17,.06)*(1.-r), uGold*.8);
  }
  float v = length(vUv-.5); col *= 1. - .64*v*v;
  gl_FragColor = vec4(col, 1.);
}`;

let gl, isGL2 = false, prog, U = {};
function setupGL(imA, imB) {
  gl = cv.getContext('webgl2', { antialias: false }); isGL2 = !!gl;
  if (!gl) gl = cv.getContext('webgl', { antialias: false });
  if (!gl) return false;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  ['uA', 'uB', 'uRes', 'uCamA', 'uCamB', 'uAspA', 'uAspB', 'uT', 'uMix', 'uGold', 'uLive', 'uStars', 'uLamp'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
  const tex = (im, unit) => {
    const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, im);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    if (isGL2) { gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); }
    else gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  };
  tex(imA, 0); tex(imB, 1);
  gl.uniform1i(U.uA, 0); gl.uniform1i(U.uB, 1);
  gl.uniform1f(U.uAspA, ASP_A); gl.uniform1f(U.uAspB, ASP_B);
  gl.uniform3fv(U.uStars, new Float32Array(STARS.flat())); gl.uniform2fv(U.uLamp, new Float32Array(LAMP));
  return true;
}

let cw = 0, ch = 0;
function resize() {
  cw = window.innerWidth; ch = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  if (gl) gl.viewport(0, 0, cv.width, cv.height);
}
window.addEventListener('resize', resize);

/* ---------- scroll-driven loop ---------- */
let target = 0, sp = 0, last = performance.now() / 1000, capIdx = -2;
function readScroll() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  target = max > 0 ? clamp(window.scrollY / max) : 0;
}
window.addEventListener('scroll', readScroll, { passive: true });

function updateDom(p) {
  let idx = -1;
  CAPS.forEach((c, i) => { if (p >= c[0] && p <= c[1]) idx = i; });
  if (idx !== capIdx) {
    capIdx = idx;
    capEl.classList.remove('on');
    if (idx >= 0) { capEl.textContent = CAPS[idx][2]; capEl.classList.toggle('low', CAPS[idx][3]); void capEl.offsetWidth; capEl.classList.add('on'); }
  }
  hintEl.style.opacity = p < .03 ? 1 : 0;
  bonEl.classList.toggle('on', p > .95);
  const end = p > .97; topEl.hidden = !end && !topEl.classList.contains('on'); topEl.classList.toggle('on', end);
  railEl.style.height = (p * 100).toFixed(1) + '%';
}

function frame() {
  const now = performance.now() / 1000, dt = Math.min(.05, now - last); last = now;
  sp += (target - sp) * (1 - Math.exp(-dt * (RM ? 12 : 4.5)));
  if (Math.abs(target - sp) < 1e-5) sp = target;
  const sa = cw / ch;
  const inside = smooth(.08, .15, sp);
  const camA = fitInside(sample(KA, sp), ASP_A, sa, inside);
  const camB = fitInside(sample(KB, sp), ASP_B, sa, 1);
  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform3f(U.uCamA, camA[0], camA[1], camA[2]);
  gl.uniform3f(U.uCamB, camB[0], camB[1], camB[2]);
  gl.uniform1f(U.uT, now % 1000);
  gl.uniform1f(U.uMix, smooth(.72, .85, sp));
  gl.uniform1f(U.uGold, smooth(.92, 1, sp));
  gl.uniform1f(U.uLive, RM ? .25 : 1);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  updateDom(sp);
  requestAnimationFrame(frame);
}

Promise.all([loadImg('cafe-terrace-at-night.jpg'), loadImg('self-portrait-straw-hat.jpg')]).then(([a, b]) => {
  resize();
  let ok = false;
  try { ok = setupGL(a, b); } catch (e) { console.error(e); ok = false; }
  if (!ok) {
    const f = document.getElementById('fallback'); f.src = a.src; f.hidden = false; cv.hidden = true;
    loadEl.classList.add('gone'); return;
  }
  readScroll(); sp = target;
  loadEl.classList.add('gone');
  requestAnimationFrame(frame);
}).catch(() => { loadEl.textContent = '絵を読み込めませんでした。ページを再読み込みしてください。'; });
})();
</script>
