<title>夜のカフェテラス</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
/* Layout: a tall scroll track drives one fixed three.js view; the painting becomes a walkable 3D street. Single night look. */
:root {
  --night: #0c1636;
  --ink: #070d24;
  --gas: #f3c95c;
  --cream: #fbf0cf;
  --ochre: #d99a3a;
  --muted: rgba(251, 240, 207, 0.55);
  --veil: rgba(7, 13, 36, 0.55);
  --font-jp: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-fr: "Cormorant Garamond", "Times New Roman", serif;
  color-scheme: dark;
}
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
body {
  background: var(--night);
  color: var(--cream);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
#track { height: 1600vh; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#glow {
  position: fixed; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at 50% 55%, rgba(255, 214, 120, 0.55), rgba(255, 170, 60, 0.18) 60%, rgba(255, 150, 50, 0.08));
  mix-blend-mode: screen;
}
#cap {
  position: fixed; left: 50%;
  bottom: calc(11% + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 8px);
  width: max-content; max-width: min(86vw, 30em);
  padding: 0.6em 1.6em;
  font-family: var(--font-jp); font-weight: 600;
  font-size: clamp(16px, 2.3vw, 28px); line-height: 1.6;
  text-align: center; color: var(--cream);
  text-shadow: 0 0 14px var(--ink), 0 0 4px var(--ink);
  background: radial-gradient(ellipse at center, var(--veil) 0%, transparent 72%);
  opacity: 0;
  transition: opacity 0.8s ease, transform 0.9s cubic-bezier(.2,.9,.3,1.2);
  pointer-events: none; text-wrap: balance;
}
#cap.on { opacity: 1; transform: translate(-50%, 0); }
#hint {
  position: fixed; left: 50%;
  bottom: calc(3.5% + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  color: var(--muted); font-family: var(--font-jp); font-size: 13px;
  transition: opacity 0.6s ease; pointer-events: none;
}
#hint .mouse { width: 22px; height: 34px; border: 2px solid var(--muted); border-radius: 12px; position: relative; }
#hint .mouse::after { content: ""; position: absolute; left: 50%; top: 6px; width: 3px; height: 7px; margin-left: -1.5px; border-radius: 2px; background: var(--gas); animation: wheel 1.8s ease-in-out infinite; }
@keyframes wheel { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(10px); opacity: 0; } 100% { opacity: 0; } }
#bonjour {
  position: fixed; left: 50%; top: 80%;
  transform: translate(-50%, -40%) scale(0.96);
  font-family: var(--font-fr); font-weight: 600;
  font-size: clamp(60px, 11vw, 180px); letter-spacing: 0.04em;
  color: var(--cream);
  text-shadow: 0 0 30px rgba(255, 214, 120, 0.9), 0 0 80px rgba(255, 180, 60, 0.6), 0 2px 0 var(--ochre);
  opacity: 0;
  transition: opacity 1.4s ease, transform 1.8s cubic-bezier(.2,.9,.3,1.1);
  pointer-events: none; white-space: nowrap;
}
#bonjour.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#rail {
  position: fixed;
  right: calc(18px + env(safe-area-inset-right, 0px));
  top: 50%; transform: translateY(-50%);
  width: 3px; height: 120px; border-radius: 2px;
  background: rgba(251, 240, 207, 0.2); pointer-events: none;
}
#rail i { position: absolute; left: 0; top: 0; width: 100%; height: 0; border-radius: 2px; background: var(--gas); }
#credit {
  position: fixed;
  left: calc(14px + env(safe-area-inset-left, 0px));
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  font-family: var(--font-jp); font-size: 11px; line-height: 1.5;
  color: var(--muted); text-shadow: 0 0 6px var(--ink);
  pointer-events: none; max-width: 40vw;
}
#top {
  position: fixed; left: 50%;
  bottom: calc(5% + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  font-family: var(--font-jp); font-weight: 600; font-size: 15px;
  color: var(--cream);
  background: rgba(10, 18, 48, 0.6);
  border: 1.5px solid rgba(243, 201, 92, 0.55);
  border-radius: 999px; padding: 0.5em 1.4em; cursor: pointer;
  opacity: 0; transition: opacity 0.6s ease;
}
#top.on { opacity: 1; }
#top:focus-visible { outline: 3px solid var(--gas); outline-offset: 3px; }
#loading {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 24px; text-align: center;
  font-family: var(--font-jp); font-size: 16px; color: var(--muted);
  background: var(--night); transition: opacity 0.8s ease;
}
#loading.gone { opacity: 0; pointer-events: none; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { #hint .mouse::after { animation: none; } }
</style>

<div id="track"></div>
<canvas id="stage" role="img" aria-label="ゴッホの「夜のカフェテラス」の中に入り、立体になった通りを歩いてカフェの前を進み、最後に麦わら帽子のゴッホに出会う。"></canvas>
<div id="glow"></div>
<div id="cap" aria-live="polite"></div>
<div id="hint"><div class="mouse"></div><span>スクロール</span></div>
<div id="bonjour" aria-hidden="true">Bonjour</div>
<div id="rail" aria-hidden="true"><i></i></div>
<div id="credit">フィンセント・ファン・ゴッホ「夜のカフェテラス」1888年／「麦わら帽子の自画像」1887年（パブリックドメイン）</div>
<button id="top" type="button" hidden>最初から</button>
<div id="loading">絵を運んでいます…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const DEG = Math.PI / 180;
const loadEl = document.getElementById('loading');
if (!window.THREE) { loadEl.textContent = '3Dの部品を読み込めませんでした。ページを再読み込みしてください。'; return; }

/* ---------- how the painter "saw" the scene ----------
   Painting coords (u right, v down, 0..1). Width/height = A.
   The eye stood 1.6 m above the street; the street vanishes at VP.
   f = focal length in painting-height units. */
const A = 2348 / 2945, ASP_B = 2087 / 2700;
const VP = [0.56, 0.52], F = 0.96, EYE = 1.6;
const STARS = [
  [.722, .024, .0146], [.507, .072, .0097], [.633, .190, .0136], [.693, .113, .0097],
  [.543, .240, .0088], [.599, .014, .0068], [.389, .039, .0058], [.569, .130, .0058],
  [.593, .268, .0063], [.598, .319, .0058], [.685, .225, .0058], [.806, .088, .0073],
  [.442, .037, .0058], [.717, .166, .0050], [.653, .072, .0048], [.757, .161, .0046]
];
const LAMP = [.37, .478];
// people in the painting: [u0, v0, u1, v1] (v1 = where their feet touch the ground)
const PEOPLE = [
  [.385, .545, .43, .665],  // waiter in white
  [.20, .585, .30, .668],   // guests, left tables
  [.30, .580, .385, .662],  // guests, middle tables
  [.43, .585, .50, .660],   // guests, right tables
  [.555, .565, .60, .648],  // man in yellow
  [.63, .555, .70, .638],   // couple walking
  [.585, .545, .615, .612], // woman in red
  [.47, .545, .51, .592]    // far figures
];

const rayOf = (u, v) => [(u - VP[0]) * A / F, -(v - VP[1]) / F];
function backDepth(u, v) {
  const [rx, ry] = rayOf(u, v);
  let z = 90;                                                   // sky
  if (ry < 0) z = Math.min(z, EYE / -ry);                       // street and terrace floor
  if (rx < 0) { const zw = 2.2 / -rx, y = EYE + ry * zw; if (y < 16) z = Math.min(z, zw); }  // café facade
  if (rx > 0) { const zr = 5.2 / rx, y = EYE + ry * zr; if (y < 11.5) z = Math.min(z, zr); } // houses on the right
  if (ry < 0.02 && Math.abs(rx) < .3) z = Math.min(z, 70);       // end of the street
  return z;
}
function awningDepth(u, v) {
  const [rx, ry] = rayOf(u, v);
  if (ry <= 0) return 0;
  const zc = (3.2 - EYE) / ry, x = rx * zc;
  return (x > -2.2 && x < -0.45 && zc < 22 && zc < backDepth(u, v)) ? zc : 0;
}

/* ---------- three.js setup ---------- */
const cv = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
const world = new THREE.Scene(), museum = new THREE.Scene();
world.background = new THREE.Color(0x0c1636); museum.background = new THREE.Color(0x0b100f);
const cam = new THREE.PerspectiveCamera(60, 1, 0.05, 400);
cam.rotation.order = 'YXZ';

const loader = new THREE.TextureLoader();
const loadTex = src => new Promise((res, rej) => loader.load(src, t => { t.flipY = false; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); res(t); }, undefined, rej));

const PAINT_FS = `
precision highp float;
varying vec2 vUv; varying float vDist; varying vec3 vWorld;
uniform sampler2D uMap; uniform float uT; uniform float uLive; uniform float uA;
uniform vec3 uStars[16]; uniform vec2 uLamp; uniform float uFog;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.03; a*=.5; } return v; }
void main(){
  vec2 ua = 1. - abs(1. - abs(vUv));   // mirror the painting past its edges
  float sky = smoothstep(.40,.30,ua.y)*smoothstep(.28,.40,ua.x);
  vec2 dn = vec2(fbm(ua*14.+vec2(uT*.12,0.)), fbm(ua*14.+vec2(5.2,uT*.1))) - .5;
  vec3 col = texture2D(uMap, ua + dn*(.006*sky + .001)*uLive).rgb;
  // up close, the street was painted with few strokes: re-pave it with strokes from the front of the canvas
  if (uFog > .5 && vWorld.y < .05) {
    float zo = -vWorld.z;
    float mag = zo / max(distance(cameraPosition, vWorld), .1);
    float w = smoothstep(1.4, 3.0, mag);
    if (w > 0.) {
      bool terrace = vWorld.x < .55 && zo > 5.5 && zo < 26.;
      vec4 rect = terrace ? vec4(.17, .72, .23, .07) : vec4(.55, .88, .40, .11);
      vec2 tile = terrace ? vec2(1.28, 2.0) : vec2(1.16, 1.0);
      vec2 t = abs(fract(vec2(vWorld.x, vWorld.z)/tile*.5)*2. - 1.);
      vec3 sw = texture2D(uMap, rect.xy + t*rect.zw).rgb;
      col = mix(col, sw*(.75 + .5*dot(col, vec3(.33))), w*.8);
    }
  }
  for (int i=0;i<16;i++) {
    vec3 s = uStars[i];
    vec2 dv = (ua-s.xy)*vec2(uA,1.); float d = length(dv);
    float tw = .7 + .3*sin(uT*2.1 + float(i)*1.9);
    col += vec3(1.,.92,.55)*exp(-d*d/(s.z*s.z*1.2))*.45*tw*uLive;
    float ang = atan(dv.y, dv.x);
    col += vec3(.95,.92,.6)*exp(-pow((d - s.z*1.9)/(s.z*.5), 2.))*(.55 + .45*sin(ang*5. - uT*1.4 + float(i)))*.28*tw*uLive;
  }
  vec2 lv = (ua-uLamp)*vec2(uA,1.);
  float fl = .92 + .05*sin(uT*7.3) + .03*sin(uT*12.7);
  col += vec3(1.,.72,.32)*exp(-dot(lv,lv)/(.0016*fl))*.35*uLive;
  col += vec3(1.,.65,.3)*exp(-dot(lv,lv)/(.03*fl))*.10*uLive;
  col = mix(col, vec3(.06,.09,.24), smoothstep(35., 95., vDist)*.35*uFog);
  gl_FragColor = vec4(col, 1.);
}`;
const PAINT_VS = `
varying vec2 vUv; varying float vDist; varying vec3 vWorld;
void main(){ vUv = uv; vec4 wp = modelMatrix*vec4(position,1.); vWorld = wp.xyz; vec4 mv = viewMatrix*wp; vDist = -mv.z; gl_Position = projectionMatrix*mv; }`;

const shared = {
  uT: { value: 0 }, uLive: { value: RM ? .25 : 1 }, uA: { value: A },
  uStars: { value: STARS.map(s => new THREE.Vector3(s[0], s[1], s[2])) },
  uLamp: { value: new THREE.Vector2(LAMP[0], LAMP[1]) }
};

function sheet(depthFn, keep, tex) {
  // a dense sheet, every vertex pushed out along the painter's line of sight to its depth
  const U0 = -0.55, U1 = 1.55, V0 = -0.3, V1 = 1.18, NU = 230, NV = 230;
  const pos = [], uvs = [], ok = [];
  for (let j = 0; j <= NV; j++) for (let i = 0; i <= NU; i++) {
    const u = lerp(U0, U1, i / NU), v = lerp(V0, V1, j / NV), z = depthFn(u, v), [rx, ry] = rayOf(u, v);
    pos.push(rx * z, EYE + ry * z, -z); uvs.push(u, v); ok.push(z > 0 ? 1 : 0);
  }
  const idx = [];
  for (let j = 0; j < NV; j++) for (let i = 0; i < NU; i++) {
    const a = j * (NU + 1) + i, b = a + 1, c = a + NU + 1, d = c + 1;
    if (keep(ok[a], ok[b], ok[c], ok[d])) idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  const m = new THREE.ShaderMaterial({ vertexShader: PAINT_VS, fragmentShader: PAINT_FS, side: THREE.DoubleSide,
    uniforms: Object.assign({ uMap: { value: tex }, uFog: { value: 1 } }, shared) });
  return new THREE.Mesh(g, m);
}
function buildWorld(tex) {
  world.add(sheet(backDepth, () => true, tex));
  world.add(sheet(awningDepth, (a, b, c, d) => a && b && c && d, tex));
}

// the people, standing up like paper dolls cut from the canvas
const dolls = [];
// people on the street stroll toward you: [index, metres walked, x where they pass]
const WALKERS = { 4: [10, .6], 5: [10.4, 1.5], 6: [11.5, .95], 7: [13, .3] };
function buildDolls(tex) {
  for (const [u0, v0, u1, v1] of PEOPLE) {
    const zp = EYE / ((v1 - VP[1]) / F);
    const cx = (u0 + u1) / 2, [rxc] = rayOf(cx, v1), [, ryt] = rayOf(cx, v0);
    const w = (u1 - u0) * A / F * zp, top = EYE + ryt * zp;
    const g = new THREE.PlaneGeometry(w, top);
    const m = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: { uMap: { value: tex }, uRect: { value: new THREE.Vector4(u0, v0, u1 - u0, v1 - v0) }, uT: shared.uT },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
      fragmentShader: `precision highp float; varying vec2 vUv; uniform sampler2D uMap; uniform vec4 uRect;
        void main(){ vec2 l = vec2(vUv.x, 1.-vUv.y);
          vec3 c = texture2D(uMap, uRect.xy + l*uRect.zw).rgb;
          float d = length((l - vec2(.5,.55))*vec2(2.,2.));
          float a = 1. - smoothstep(.7, 1., d);
          a *= smoothstep(0., .06, 1.-l.y) + step(.9, l.y);
          gl_FragColor = vec4(c, a); }`
    });
    const mesh = new THREE.Mesh(g, m);
    mesh.position.set(Math.max(rxc * zp, -1.95), top / 2, -zp);
    mesh.userData = { x0: mesh.position.x, y0: mesh.position.y, z0: mesh.position.z, ph: Math.random() * 6 };
    world.add(mesh); dolls.push(mesh);
  }
}

// warm flecks of paint drifting in the air, so the space reads as space
let flecks;
function buildFlecks() {
  const n = 420, p = new Float32Array(n * 3), ph = new Float32Array(n);
  for (let i = 0; i < n; i++) { p[i * 3] = lerp(-2.2, 4.5, Math.random()); p[i * 3 + 1] = lerp(.2, 7, Math.random()); p[i * 3 + 2] = lerp(-40, -1.5, Math.random()); ph[i] = Math.random() * 6.28; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('ph', new THREE.BufferAttribute(ph, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uT: shared.uT, uPx: { value: 1 }, uOn: { value: 0 } },
    vertexShader: `attribute float ph; uniform float uT; uniform float uPx; varying float vA;
      void main(){ vec3 p = position + vec3(sin(uT*.4+ph)*.25, sin(uT*.3+ph*2.)*.18, cos(uT*.35+ph)*.25);
        vec4 mv = modelViewMatrix*vec4(p,1.); gl_Position = projectionMatrix*mv;
        gl_PointSize = uPx*(26./-mv.z); vA = .55+.45*sin(uT*1.7+ph*3.); }`,
    fragmentShader: `uniform float uOn; varying float vA; void main(){ float d = length(gl_PointCoord-.5); float a = smoothstep(.5,0.,d);
      gl_FragColor = vec4(vec3(1.,.82,.45)*a*vA*uOn, 1.); }`
  });
  flecks = new THREE.Points(g, m); world.add(flecks);
}

// Vincent, painted into the terrace
let vincent;
const VG = new THREE.Vector3(-1.3, 1.42, -9.4);
function buildVincent(tex) {
  const g = new THREE.PlaneGeometry(1.0, 1.0 / ASP_B);
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uMap: { value: tex }, uOp: { value: 0 }, uT: shared.uT },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `precision highp float; varying vec2 vUv; uniform sampler2D uMap; uniform float uOp; uniform float uT;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
      float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
        return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
      void main(){ vec2 uv = vec2(vUv.x, 1.-vUv.y);
        vec2 dn = vec2(noise(uv*20.+uT*.2), noise(uv*20.+3.+uT*.2)) - .5;
        vec3 c = texture2D(uMap, clamp(uv + dn*.0015, 0., 1.)).rgb;
        float d = length((uv - vec2(.5,.5))*vec2(2.,1.65));
        float edge = .78 + (noise(vec2(atan(uv.y-.5, uv.x-.5)*6., uT*.3))-.5)*.18;
        float a = 1. - smoothstep(edge-.12, edge, d);
        gl_FragColor = vec4(c, a*uOp); }`
  });
  vincent = new THREE.Mesh(g, m); vincent.position.copy(VG); world.add(vincent);
}

// the museum: dark wall, gilded frame, and the painting hanging on the painter's own picture plane
function buildMuseum(tex) {
  const ctx2 = document.createElement('canvas'); ctx2.width = 512; ctx2.height = 512;
  const c = ctx2.getContext('2d'); c.fillStyle = '#141b19'; c.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 9000; i++) { c.fillStyle = `rgba(${30 + Math.random() * 25},${40 + Math.random() * 25},${36 + Math.random() * 20},.35)`; c.fillRect(Math.random() * 512, Math.random() * 512, 2, 6 + Math.random() * 8); }
  const g = c.createRadialGradient(256, 150, 10, 256, 220, 300); g.addColorStop(0, 'rgba(255,230,180,.22)'); g.addColorStop(1, 'rgba(255,230,180,0)');
  c.fillStyle = g; c.fillRect(0, 0, 512, 512);
  const wallTex = new THREE.CanvasTexture(ctx2);
  const cx = (0.5 - VP[0]) * A, cy = -(0.5 - VP[1]);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(9, 6), new THREE.MeshBasicMaterial({ map: wallTex }));
  wall.position.set(cx, cy + .9, -F - .02); museum.add(wall);
  const painting = new THREE.Mesh(new THREE.PlaneGeometry(A, 1), new THREE.ShaderMaterial({
    vertexShader: PAINT_VS, fragmentShader: PAINT_FS,
    uniforms: Object.assign({ uMap: { value: tex }, uFog: { value: 0 } }, shared)
  }));
  // flip v so painting uv matches the world sheet
  const uv = painting.geometry.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setY(i, 1 - uv.getY(i));
  painting.position.set(cx, cy, -F); museum.add(painting);
  const gold = new THREE.MeshBasicMaterial({ color: 0xc9993c }), goldDk = new THREE.MeshBasicMaterial({ color: 0x8f6420 });
  const t = .07;
  [[0, .5 + t / 2, A + 2 * t, t, gold], [0, -.5 - t / 2, A + 2 * t, t, goldDk], [-A / 2 - t / 2, 0, t, 1, gold], [A / 2 + t / 2, 0, t, 1, goldDk]].forEach(([x, y, w, h, m]) => {
    const b = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); b.position.set(cx + x, cy + y, -F + .005); museum.add(b);
  });
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(A + .3, 1.3), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .45 }));
  shadow.position.set(cx + .04, cy - .06, -F - .01); museum.add(shadow);
}

/* ---------- camera ---------- */
// asymmetric frustum that frames the painting exactly as it hangs; blends into an ordinary lens once inside
function startWindow(aspect) {
  let H = A / aspect; if (H > 1) H = 1;
  const W = H * aspect;
  const vc = clamp(0.42, H / 2, 1 - H / 2);
  const xl = (0.5 - VP[0]) * A - W / 2, yt = (vc - VP[1]) - H / 2;
  return [xl / F, (xl + W) / F, -yt / F, -(yt + H) / F];
}
function setFrustum(aspect, blend, fovDeg) {
  const s = startWindow(aspect), hh = Math.tan(fovDeg / 2 * DEG), hw = hh * aspect;
  const l = lerp(s[0], -hw, blend), r = lerp(s[1], hw, blend), t = lerp(s[2], hh, blend), b = lerp(s[3], -hh, blend);
  const n = cam.near;
  cam.projectionMatrix.makePerspective(l * n, r * n, t * n, b * n, n, cam.far);
  cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
}

// the walk: [scroll, x, y, z, yaw (deg, + looks left), pitch (deg), lens blend]
const PATH = [
  [0.13, 0.0, 1.60, 0.0, 0, 0, 0],       // standing where the painter stood
  [0.21, 0.0, 1.60, -2.2, 0, 4, 1],      // one step in; the street opens up
  [0.30, -0.2, 1.60, -3.4, 40, 1, 1],    // turn left: the café
  [0.40, -0.35, 1.60, -5.4, 22, 0, 1],   // walk along the terrace
  [0.48, -0.35, 1.60, -6.4, -10, 0, 1],  // look ahead: people walking this way
  [0.58, -0.35, 1.60, -7.0, -6, -1, 1],  // they pass by
  [0.66, -0.40, 1.60, -7.1, 40, -3, 1],  // back to the terrace
  [0.80, -0.95, 1.50, -8.6, 40, -2, 1],  // walk up to the painter
  [0.92, -1.12, 1.46, -8.95, 40, -1, 1], // face to face
  [1.00, -1.13, 1.46, -8.97, 40, -1, 1]
];
function samplePath(p) {
  if (p <= PATH[0][0]) return PATH[0].slice(1);
  for (let i = 0; i < PATH.length - 1; i++) {
    const a = PATH[i], b = PATH[i + 1];
    if (p <= b[0]) { const t = ease((p - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, k) => lerp(v, b[k + 1], t)); }
  }
  return PATH[PATH.length - 1].slice(1);
}

const CAPS = [
  [0.00, 0.05, '閉館後の美術館。一枚の絵だけが、まだ光っている。'],
  [0.06, 0.12, '近づくと、絵の中から夜風が吹いてきた。'],
  [0.15, 0.23, '——絵の中に、入った。'],
  [0.25, 0.33, '左を向くと、黄色く光るカフェテラス。'],
  [0.35, 0.43, 'お店にそって、石畳を歩いていく。'],
  [0.45, 0.57, '夜の散歩をする人たちが、こちらへ歩いてきて……すれちがう。'],
  [0.61, 0.70, 'テラスの奥に、麦わら帽子の男がいた。'],
  [0.76, 0.85, '「やあ、きみも絵の中に来たのかい？」'],
  [0.86, 0.94, '「ぼくはフィンセント。この夜を描いているところさ」']
];

/* ---------- DOM + input ---------- */
const capEl = document.getElementById('cap'), hintEl = document.getElementById('hint');
const bonEl = document.getElementById('bonjour'), railEl = document.querySelector('#rail i');
const topEl = document.getElementById('top'), glowEl = document.getElementById('glow');
topEl.addEventListener('click', () => window.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }));
let target = 0, sp = 0, capIdx = -2, mx = 0, my = 0, smx = 0, smy = 0;
function readScroll() { const max = document.documentElement.scrollHeight - window.innerHeight; target = max > 0 ? clamp(window.scrollY / max) : 0; }
window.addEventListener('scroll', readScroll, { passive: true });
window.addEventListener('pointermove', e => { mx = e.clientX / window.innerWidth * 2 - 1; my = e.clientY / window.innerHeight * 2 - 1; }, { passive: true });

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  if (flecks) flecks.material.uniforms.uPx.value = renderer.getPixelRatio() * window.innerHeight / 900 * 6;
}
window.addEventListener('resize', resize);

function updateDom(p) {
  let idx = -1;
  CAPS.forEach((c, i) => { if (p >= c[0] && p <= c[1]) idx = i; });
  if (idx !== capIdx) {
    capIdx = idx; capEl.classList.remove('on');
    if (idx >= 0) { capEl.textContent = CAPS[idx][2]; void capEl.offsetWidth; capEl.classList.add('on'); }
  }
  hintEl.style.opacity = p < .03 ? 1 : 0;
  bonEl.classList.toggle('on', p > .955);
  glowEl.style.opacity = smooth(.93, 1, p).toFixed(3);
  const end = p > .975; topEl.hidden = !end && !topEl.classList.contains('on'); topEl.classList.toggle('on', end);
  railEl.style.height = (p * 100).toFixed(1) + '%';
}

let last = performance.now() / 1000;
function frame() {
  const now = performance.now() / 1000, dt = Math.min(.05, now - last); last = now;
  sp += (target - sp) * (1 - Math.exp(-dt * (RM ? 12 : 4)));
  if (Math.abs(target - sp) < 1e-5) sp = target;
  smx += (mx - smx) * (1 - Math.exp(-dt * 3)); smy += (my - smy) * (1 - Math.exp(-dt * 3));
  shared.uT.value = now % 1000;
  const aspect = window.innerWidth / window.innerHeight;
  const inside = sp >= PATH[0][0];
  if (!inside) {
    // museum: back away from the wall, then walk up until the frame vanishes past the edges
    const k = ease(clamp(sp / PATH[0][0]));
    cam.position.set(0, lerp(-0.05, 0, k), lerp(3.4, 0, k));
    cam.rotation.set(0, 0, 0);
    setFrustum(aspect, 0, 60);
    renderer.render(museum, cam);
  } else {
    const [x, y, z, yaw, pitch, blend] = samplePath(sp);
    const look = RM ? 0 : smooth(.13, .2, sp);
    cam.position.set(x, y, z);
    let yw = yaw * DEG - smx * .07 * look, pt = pitch * DEG - smy * .04 * look;
    if (sp > .7) { // turn the head to keep Vincent in view as you approach
      const dx = VG.x - x, dz = VG.z - z, dy = VG.y + .08 - y;
      const ty = Math.atan2(-dx, -dz), tp = Math.atan2(dy, Math.hypot(dx, dz));
      const w = smooth(.7, .8, sp); yw = lerp(yw, ty, w); pt = lerp(pt, tp, w);
    }
    cam.rotation.set(pt, yw, 0);
    setFrustum(aspect, blend, 62);
    vincent.material.uniforms.uOp.value = smooth(.58, .66, sp);
    vincent.rotation.y = Math.atan2(cam.position.x - VG.x, cam.position.z - VG.z);
    dolls.forEach((d, i) => {
      const w = WALKERS[i], ud = d.userData;
      if (w) {
        const k = smooth(.38, .64, sp);
        d.position.set(lerp(ud.x0, w[1], smooth(0, .6, k)), ud.y0 + (RM ? 0 : Math.abs(Math.sin(now * 4 + ud.ph)) * .05 * Math.sin(k * Math.PI)), ud.z0 + w[0] * k);
      }
      d.rotation.y = Math.atan2(cam.position.x - d.position.x, cam.position.z - d.position.z) * smooth(.15, .3, sp);
    });
    flecks.material.uniforms.uOn.value = smooth(.14, .24, sp);
    renderer.render(world, cam);
  }
  updateDom(sp);
  requestAnimationFrame(frame);
}

Promise.all([loadTex('cafe-terrace-at-night.jpg'), loadTex('self-portrait-straw-hat.jpg')]).then(([a, b]) => {
  a.minFilter = THREE.LinearMipmapLinearFilter; b.minFilter = THREE.LinearMipmapLinearFilter;
  a.wrapS = a.wrapT = THREE.MirroredRepeatWrapping;
  buildWorld(a); buildDolls(a); buildFlecks(); buildVincent(b); buildMuseum(a);
  resize(); readScroll(); sp = target;
  loadEl.classList.add('gone');
  requestAnimationFrame(frame);
}).catch(e => { console.error(e); loadEl.textContent = '絵を読み込めませんでした。ページを再読み込みしてください。'; });
})();
</script>
